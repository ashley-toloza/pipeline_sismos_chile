name: Automatizacion del ETL de Sismos

on:
  schedule:
    - cron: '0 6 * * *' # Se ejecuta automáticamente todos los días a las 06:00 UTC
  workflow_dispatch:   # Permite que tú lo actives manualmente con un botón desde la web

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código del repositorio al servidor virtual
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python limpio
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar las librerías necesarias de tu proyecto
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Ejecutar tu pipeline de datos para extraer los sismos
    - name: Ejecutar Pipeline ETL
      run: python src/etl.py

    # 5. Subir la base de datos .db actualizada de regreso a tu GitHub
    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 ETL Automatizado: Base de datos sismológica actualizada" && git push)
