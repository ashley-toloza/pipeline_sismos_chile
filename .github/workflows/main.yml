name: Automatizacion del ETL de Sismos

# Definimos cuándo se va a ejecutar
on:
  schedule:
    - cron: '0 6 * * *' # Se ejecuta todos los días a las 06:00 UTC
  workflow_dispatch:   # Permite que tú lo actives manualmente desde la web de GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest # Usa un servidor Linux gratuito de GitHub

    steps:
    # 1. Copiar el código de tu repositorio al servidor de GitHub
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    # 2. Instalar Python en ese servidor
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instalar las librerías de tu proyecto
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Ejecutar tu script ETL para descargar nuevos sismos
    - name: Ejecutar Pipeline ETL
      run: python src/etl.py

    # 5. Guardar la base de datos actualizada de vuelta en tu GitHub
    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 ETL Automatizado: Base de datos sismológica actualizada" && git push)
